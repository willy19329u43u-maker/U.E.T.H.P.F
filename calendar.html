<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario - U.E. Paulo Freire</title>
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="app-body">
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <img src="assets/img/logo-escudo.svg" alt="Logo U.E. Paulo Freire" class="brand-logo">
                <span class="brand-text">U.E. Paulo Freire</span>
            </div>
            <nav class="menu">
                <a href="dashboard.html" class="menu-link">🏠 Panel</a>
                <a href="students.html" class="menu-link">🎓 Estudiantes</a>
                <a href="attendance.html" class="menu-link">✅ Asistencia</a>
                <a href="tardies.html" class="menu-link">⏰ Atrasos</a>
                <a href="schedules.html" class="menu-link">🕒 Horarios</a>
                <a href="calendar.html" class="menu-link active">📅 Calendario</a>
                <a href="announcements.html" class="menu-link">📢 Anuncios</a>
                <a href="profile.html" class="menu-link">👤 Perfil</a>
                <a href="#" id="logoutBtn" class="menu-link">Salir</a>
            </nav>
        </aside>
        <div class="main">
            <header class="topbar">
                <div class="topbar-controls">
                    <button id="menuToggle" class="btn icon-btn" aria-label="Menu">☰</button>
                    <button id="sideToggle" class="btn icon-btn" aria-label="Expandir">⇄</button>
                </div>
                <h1 class="metal-text">Calendario</h1>
                <form class="search-form" method="get" action="search.html" style="margin-right: auto;">
                    <input class="input" type="text" name="q" placeholder="🔍 Buscar..." value="">
                </form>
                <div class="topbar-user">
                    <a class="btn icon-btn" href="#">☀️</a>
                    <a class="btn icon-btn" href="#">ES</a>
                    <a href="#" id="logoutBtn" class="btn btn-danger small" style="text-decoration: none;">Salir</a>
                </div>
            </header>
            <main class="content">
                <section class="card animate-in">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap">
                        <h2 class="metal-text" style="margin:0">Calendario</h2>
                        <form method="get" action="calendar.html" style="display:flex;gap:5px;margin:0">
                            <input type="text" name="q" placeholder="Buscar evento..." value="" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px;">
                            <button class="btn btn-metal small" type="submit">🔍</button>
                        </form>
                    </div>
                    <div class="table-responsive"><table class="table">
                        <thead><tr><th>Título</th><th>Fecha</th><th>Tipo</th><th>Responsable</th></tr></thead>
                        <tbody>
                            <tr>
                                <td>Bienvenidos al sistema</td>
                                <td>04/11/2026</td>
                                <td>Global</td>
                                <td>Administrador</td>
                            </tr>
                        </tbody>
                    </table></div>
                </section>
            </main>
        </div>
    </div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
