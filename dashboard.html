<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - U.E. Paulo Freire</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-body">
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <img src="assets/img/logo-escudo.svg" alt="Logo U.E. Paulo Freire" class="brand-logo">
                <span class="brand-text">U.E. Paulo Freire</span>
            </div>
            <nav class="menu">
                <a href="dashboard.html" class="menu-link active">🏠 Panel</a>
                <a href="students.html" class="menu-link">🎓 Estudiantes</a>
                <a href="attendance.html" class="menu-link">✅ Asistencia</a>
                <a href="tardies.html" class="menu-link">⏰ Atrasos</a>
                <a href="schedules.html" class="menu-link">🕒 Horarios</a>
                <a href="calendar.html" class="menu-link">📅 Calendario</a>
                <a href="announcements.html" class="menu-link">📢 Anuncios</a>
                <a href="reports.html" class="menu-link">📊 Reportes</a>
                <a href="users.html" class="menu-link">👥 Usuarios</a>
                <a href="notifications.html" class="menu-link">🔔 Notificaciones</a>
                <a href="profile.html" class="menu-link">👤 Perfil</a>
                <a href="#" id="logoutBtn" class="menu-link">Salir</a>
            </nav>
        </aside>
        <div class="main">
            <header class="topbar">
                <div class="topbar-controls">
                    <button id="menuToggle" class="btn icon-btn" aria-label="Menu">☰</button>
                    <button id="sideToggle" class="btn icon-btn" aria-label="Expandir">⇄</button>
                </div>
                <h1 class="metal-text">Panel</h1>
                <form class="search-form" method="get" action="search.html" style="margin-right: auto;">
                    <input class="input" type="text" name="q" placeholder="🔍 Buscar..." value="">
                </form>
                <div class="topbar-user" style="display: flex; gap: 8px; align-items: center;">
                    <a class="btn icon-btn" href="#">☀️</a>
                    <a class="btn icon-btn" href="#">ES</a>
                    <img src="assets/img/avatars/avatar-estudiante.svg" alt="Avatar" class="topbar-avatar" onerror="this.src='assets/img/avatars/avatar-estudiante.svg'">
                    <span class="badge badge-accent">estudiante</span>
                    <a href="#" id="logoutBtn" class="btn btn-danger small" style="text-decoration: none;">Salir</a>
                </div>
            </header>
            <main class="content">
                <section class="card animate-in">
                    <div style="display:flex;align-items:center;gap:16px">
                        <img src="assets/img/avatars/avatar-estudiante.svg" alt="Avatar" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--primary)" onerror="this.src='assets/img/avatars/avatar-estudiante.svg'">
                        <div>
                            <h2 class="metal-text" style="margin:0">Bienvenido, Usuario</h2>
                            <p style="margin:4px 0 0;color:var(--muted)">Estudiante · Sin correo</p>
                        </div>
                    </div>
                </section>
                <section class="cards">
                    <article class="card stat-card reveal">
                        <h3>Estudiantes</h3>
                        <strong class="count" data-count="0">0</strong>
                    </article>
                    <article class="card stat-card reveal">
                        <h3>Asistencia</h3>
                        <strong class="count" data-count="0">0</strong>
                    </article>
                    <article class="card stat-card reveal">
                        <h3>Calificaciones</h3>
                        <strong class="count" data-count="0">0</strong>
                    </article>
                    <article class="card stat-card reveal">
                        <h3>Horarios</h3>
                        <strong class="count" data-count="0">0</strong>
                    </article>
                </section>
            </main>
        </div>
    </div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
